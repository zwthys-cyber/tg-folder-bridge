name: Inspect collector runtime remotely
on:
  push:
    paths: ['.github/workflows/source-runtime-status.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: cloudflare
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
      RUNTIME_NAME: sougabot-runtime-q7j9q4w7wq64h46q5
    steps:
      - name: Apply tested collector changes to the existing runtime
        run: |
          gh codespace ssh -c "$RUNTIME_NAME" -- 'cd /workspaces/tg-folder-bridge && .venv/bin/python -' <<'PY'
          import sqlite3, subprocess
          from contextlib import closing
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          previous='f39031e8f6af8f3d41cd4bb697b9ebe8d8ab7286'
          expected='ebc628ebd851ba2516afa54d69581b07b77d3e89'
          root=Path('/workspaces/.tg-runtime')
          current=git('rev-parse','HEAD')
          if current not in {previous,expected}:
              raise SystemExit('Unexpected deployed revision')
          for args in (('diff','--quiet'),('diff','--cached','--quiet')):
              subprocess.run(['git',*args],check=True)
          git('fetch','origin','main')
          if git('rev-parse','FETCH_HEAD')!=expected:
              raise SystemExit('Main has moved since testing')
          with closing(sqlite3.connect((root/'bridge/data/collector.sqlite3').as_uri()+'?mode=ro',uri=True)) as db:
              if db.execute("SELECT 1 FROM items WHERE state='dispatching' LIMIT 1").fetchone():
                  raise SystemExit('Wait for the collector to confirm its current submission')
          git('merge','--ff-only',expected)
          control=['.venv/bin/supervisorctl','-c',str(root/'supervisord.conf')]
          subprocess.run(control+['restart','collector'],check=True)
          print('Collector deployed revision',git('rev-parse','--short','HEAD'))
          PY
      - name: Read business state only
        run: |
          gh codespace ssh -c "$RUNTIME_NAME" -- 'cd /workspaces/tg-folder-bridge && .venv/bin/python -' <<'PY'
          import json, re, sqlite3, subprocess, time
          from pathlib import Path
          root=Path('/workspaces/.tg-runtime/bridge/data')
          config=root.parents[1]/'supervisord.conf'
          print(subprocess.run(['.venv/bin/supervisorctl','-c',str(config),'status','souga','collector'],capture_output=True,text=True).stdout)
          print('deployed_commit',subprocess.check_output(['git','rev-parse','--short','HEAD'],text=True).strip())
          for program in ('collector','souga'):
              recent=[]
              for stream in ('stdout','stderr'):
                  output=subprocess.run(['.venv/bin/supervisorctl','-c',str(config),'tail',program,stream],
                                        capture_output=True,text=True,timeout=8).stdout
                  recent.extend(re.findall(r'^(?:[a-zA-Z_][\w.]*\.)?([a-zA-Z_][\w]*(?:Error|Exception)):',output,re.M))
              print(program,'recent_exception_types',recent[-8:])
          for filename in ['index.sqlite3','collector.sqlite3']:
              db=sqlite3.connect((root/filename).as_uri()+'?mode=ro',uri=True)
              if filename=='index.sqlite3':
                  print('jobs',db.execute('SELECT state,count(*) FROM jobs GROUP BY state').fetchall())
                  print('latest_jobs',db.execute('SELECT title,state,expected,(SELECT count(*) FROM files WHERE files.job=jobs.id) FROM jobs ORDER BY rowid DESC LIMIT 5').fetchall())
              else:
                  print('links',db.execute('SELECT state,count(*) FROM items GROUP BY state').fetchall())
                  print('cursor',db.execute('SELECT * FROM cursor').fetchall())
                  print('head',db.execute("SELECT key,value FROM settings WHERE key LIKE 'head%'").fetchall())
                  print('newest_links',db.execute('SELECT title,state FROM items ORDER BY rowid DESC LIMIT 6').fetchall())
              db.close()
          state=root/'automation.json'
          if state.exists():
              flags=json.loads(state.read_text())
              print('pause_flags',{k:flags.get(k,False) for k in ['collector_paused','transfers_paused']})
          heartbeat=root/'collector-heartbeat.json'
          if heartbeat.exists():
              print('heartbeat_age_seconds',round(time.time()-json.loads(heartbeat.read_text())['at']))
          PY
