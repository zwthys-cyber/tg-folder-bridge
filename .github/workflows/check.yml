name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ensure content probe is available
        run: |
          if ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: python -m compileall -q notifications.py menu_actions.py capture_time.py capture_backfill.py delivery.py operations.py browse_navigation.py automation_control.py backup_metadata.py collect_links.py collector_state.py source_catalog.py source_lock.py core.py bridge.py catalog_ui.py folder_cover.py media_spool.py previews.py fast_upload.py fast_download.py transfer_settings.py transport_recovery.py adaptive_speed.py upload_transport.py transfer_metrics.py bot_api_config.py local_upload.py content_identity.py benchmark_upload.py configure_transfer.py reset_transfers.py main.py login.py souga_adapter.py integrations tests
      - run: timeout --kill-after=10s 120s python -u -m unittest discover -s tests -v
  package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package tracked source only
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=tg-folder-bridge/ -o dist/tg-folder-bridge.zip HEAD
          cd dist
          sha256sum tg-folder-bridge.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tg-folder-bridge
          path: dist/
          retention-days: 30
