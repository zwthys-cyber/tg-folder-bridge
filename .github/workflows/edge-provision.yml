name: Provision edge resources
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-production
  cancel-in-progress: false
jobs:
  provision:
    environment: cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create or reuse only the named D1 database and queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/provision_edge.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: edge-resource-ids
          path: edge-resources.json
          retention-days: 7
